plugins {
    id 'com.android.library'
}
def baselineTest = providers.gradleProperty('fawBaselineTest').map { value ->
    if (!(value in ['true', 'false'])) throw new GradleException('fawBaselineTest must be true or false')
    value.toBoolean()
}.getOrElse(false)
def clusterTuning = providers.gradleProperty('fawClusterTuning').map { value ->
    if (!(value in ['true', 'false'])) throw new GradleException('fawClusterTuning must be true or false')
    value.toBoolean()
}.getOrElse(false)

android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 28
        targetSdk = 37
        buildConfigField 'boolean', 'FAW_NAVIGATION_OUTPUTS_ENABLED', (!baselineTest).toString()
        buildConfigField 'boolean', 'FAW_WHEEL_CONTROL_ENABLED', (!baselineTest).toString()
        buildConfigField 'boolean', 'FAW_AUTOMATIC_APPEARANCE_ENABLED', (!baselineTest).toString()
        buildConfigField 'boolean', 'FAW_CLUSTER_TUNING_ENABLED', clusterTuning.toString()

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-28'
            }
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    ndkVersion = '28.2.13676358'
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig = true
    }
}
dependencies {
    implementation libs.androidx.app
    implementation libs.bouncycastle
    implementation libs.jmdns
    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.17'
}
