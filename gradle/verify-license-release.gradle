// Release packages must never silently fall back to an unlicensed development build.
def licenseConfiguration = ['SERVER_URL', 'PUBLIC_KEY_SPKI', 'OIDC_ISSUER', 'SIGNING_CERT_SHA256'].collectEntries { name ->
    [(name): providers.environmentVariable("AUTUNN_LICENSE_${name}")
        .orElse(providers.environmentVariable("FAW_LICENSE_${name}")).getOrElse('')]
}
def releaseKeystore = android.signingConfigs.getByName('release').storeFile
def releaseKeystorePassword = providers.environmentVariable('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = providers.environmentVariable('ANDROID_KEY_ALIAS')
def verifyLicenseRelease = tasks.register('verifyLicenseRelease') {
    group = 'verification'
    description = 'Require HTTPS licensing endpoints, a P-256 verification key and the APK signer fingerprint.'
    inputs.properties(licenseConfiguration)
    doLast {
        licenseConfiguration.each { name, value ->
            if (!value) throw new GradleException("Licensed release requires AUTUNN_LICENSE_${name}")
        }
        ['SERVER_URL', 'OIDC_ISSUER'].each { name ->
            def uri = new URI(licenseConfiguration[name])
            if (uri.scheme != 'https' || !uri.host || uri.userInfo || uri.query || uri.fragment) {
                throw new GradleException("AUTUNN_LICENSE_${name} must be a HTTPS base URL without credentials, query or fragment")
            }
        }
        if (!(licenseConfiguration.SIGNING_CERT_SHA256 ==~ /[0-9a-f]{64}/)) {
            throw new GradleException('AUTUNN_LICENSE_SIGNING_CERT_SHA256 must be the lowercase SHA-256 fingerprint of the APK signing certificate')
        }
        if (!releaseKeystore.isFile() || !releaseKeystorePassword.isPresent() || !releaseKeyAlias.isPresent()) {
            throw new GradleException('A licensed release requires the configured Android signing keystore and alias')
        }
        def store = java.security.KeyStore.getInstance(releaseKeystore, releaseKeystorePassword.get().toCharArray())
        def certificate = store.getCertificate(releaseKeyAlias.get())
        if (certificate == null) throw new GradleException('Android release signing alias has no certificate')
        def fingerprint = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded).encodeHex().toString()
        if (fingerprint != licenseConfiguration.SIGNING_CERT_SHA256) {
            throw new GradleException('AUTUNN_LICENSE_SIGNING_CERT_SHA256 does not match the configured Android release signing certificate')
        }
        try {
            def encoded = Base64.urlDecoder.decode(licenseConfiguration.PUBLIC_KEY_SPKI)
            def key = java.security.KeyFactory.getInstance('EC').generatePublic(new java.security.spec.X509EncodedKeySpec(encoded))
            def expected = java.security.AlgorithmParameters.getInstance('EC')
            expected.init(new java.security.spec.ECGenParameterSpec('secp256r1'))
            def curve = expected.getParameterSpec(java.security.spec.ECParameterSpec)
            if (!(key instanceof java.security.interfaces.ECPublicKey) || key.params.order != curve.order || key.params.generator != curve.generator) {
                throw new IllegalArgumentException('Expected P-256 key')
            }
        } catch (Exception invalid) {
            throw new GradleException('AUTUNN_LICENSE_PUBLIC_KEY_SPKI must be a base64url DER X509 P-256 public key', invalid)
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn(verifyLicenseRelease) }
