services:
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/bootstrap-local.sh first}
      LICENSE_DATABASE_PASSWORD: ${LICENSE_DATABASE_PASSWORD:?Missing database password}
      KEYCLOAK_DATABASE_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:?Missing Keycloak database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-faw-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:?Missing Keycloak database password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Missing administrator password}
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
    ports: ["127.0.0.1:8081:8080"]
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  license-api:
    build: {context: .., dockerfile: authorization-server/Dockerfile}
    # Match the owner of 0600 host-mounted signing files; bootstrap records these IDs.
    user: "${LICENSE_UID:?Missing key file owner}:${LICENSE_GID:?Missing key file group}"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/faw_license
      DATABASE_USER: faw_license
      DATABASE_PASSWORD: ${LICENSE_DATABASE_PASSWORD:?Missing database password}
      OIDC_ISSUER: http://localhost:8081/realms/faw-play
      OIDC_JWKS: http://keycloak:8080/realms/faw-play/protocol/openid-connect/certs
      LICENSE_PRIVATE_KEY_FILE: /run/faw-license/license-private.pem
      LICENSE_PUBLIC_KEY_FILE: /run/faw-license/license-public.pem
      LICENSE_ALLOWED_APP_IDS: ${LICENSE_ALLOWED_APP_IDS:-com.shihab.diplay,com.shihab.diplay.hudtest,com.shilapi.xcertplay}
      UPDATE_DIRECTORY: /run/faw-updates
      UPDATE_SIGNING_CERTIFICATES: ${UPDATE_SIGNING_CERTIFICATES:-}
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./secrets:/run/faw-license:ro", "./updates:/run/faw-updates"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

volumes:
  postgres-data:
